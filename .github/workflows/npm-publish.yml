name: Publish to npm

# Publishes @unfoldingword/door43-preview-renderers to npm when a GitHub release
# is published, with npm trusted publishing (OIDC): no npm token is stored. The
# package's Trusted Publisher on npmjs.com names this repository and this
# workflow file (npm-publish.yml); npm accepts a publish only from here. With
# trusted publishing from a public repository, npm adds provenance itself.
# Requires npm >= 11.5.1 and Node >= 22.14 (docs.npmjs.com/trusted-publishers).
#
# Idempotent: if the version in package.json is already on the registry, the
# publish step is skipped (so re-running, or the v1.5.0 release that matches the
# already-published version, passes green instead of erroring).
#
# Create a release tagged vX.Y.Z (matching package.json's version) to trigger it.
on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default; the publish job adds only the OIDC token it needs.
permissions:
  contents: read

jobs:
  publish:
    # GitHub-hosted: npm does not accept trusted publishing from self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm exchange the workflow's OIDC token for a publish
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        # v11 to match local + read pnpm-workspace.yaml's `allowBuilds:` key
        # (pnpm 9 errors "packages field missing or empty" on that file).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use an npm that supports trusted publishing
        # Node 22 ships npm 10; trusted publishing needs 11.5.1 or later. Pinned
        # to a release that has been out for a while.
        run: |
          npm install -g npm@11.6.2
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG)."
            exit 1
          fi

      - name: Publish to npm (skip if version already published)
        # No NODE_AUTH_TOKEN: npm authenticates with the job's OIDC token.
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on the registry — skipping publish."
          else
            # prepare script builds dist/ via rollup; publishConfig sets public access
            npm publish
          fi
