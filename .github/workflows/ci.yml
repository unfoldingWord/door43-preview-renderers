name: CI

# Lint, format-check, test and build on every pull request and on pushes to main, so a PR can't
# merge green without the suite passing. Mirrors the toolchain in npm-publish.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job; a job that needs more must say so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (with coverage threshold)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify the built entry exports the public API
        # 1.5.0 shipped a CJS bundle under `type: module`, so a bare import
        # returned no exports at all. Import the package by name, so the
        # `exports` map is what resolves (as a consumer sees it), and check the
        # names, not a count.
        run: |
          node --input-type=module <<'EOF'
          const required = [
            'BibleBookData',
            'PAGE_SIZES',
            'alignedBibleSubjects',
            'assemblePrintDocument',
            'buildAppendicesToc',
            'buildCoverPage',
            'convertMarkdown',
            'convertNoteFromMD2HTML',
            'copyrightCss',
            'coverCss',
            'fetchResource',
            'filterCatalogEntries',
            'findResources',
            'generateCopyrightAndLicenseHtml',
            'generatePdf',
            'generatePdfFromAssembled',
            'generatePdfViaService',
            'generateTocFromHtml',
            'generateTocHtml',
            'getAllCatalogEntries',
            'getCatalogEntry',
            'getPrintCss',
            'getResourceData',
            'listLanguages',
            'parseBooksOption',
            'renderAlignedBibleHtml',
            'renderAppendicesHtml',
            'renderHTML',
            'renderHtmlData',
            'renderObsHtml',
            'renderPdf',
            'renderTranslationAcademyHtml',
            'renderTranslationNotesHtml',
            'renderTranslationWordsHtml',
            'renderTranslationWordsLinksHtml',
            'renderTsvQuestionsHtml',
            'requiredSubjectsMap',
            'resolveComposeOptions',
            'resolvePageSize',
            'resolveRef',
            'resolveResource',
            'resolveTarget',
            'runningHeaderModeFor',
            'selectAlignedBibles',
            'subjectIdentifierMap',
            'supportsBodyColumns',
            'testamentOf'
          ];
          const spec = '@unfoldingword/door43-preview-renderers';
          const href = import.meta.resolve(spec);
          console.log('resolved ' + href);
          if (!href.endsWith('/dist/index.esm.js')) {
            console.error('exports map must resolve to dist/index.esm.js');
            process.exit(1);
          }
          const m = await import(href);
          const missing = required.filter((k) => m[k] === undefined);
          if (missing.length) {
            console.error('missing exports: ' + missing.join(', '));
            process.exit(1);
          }
          console.log(required.length + ' required exports present');
          EOF
