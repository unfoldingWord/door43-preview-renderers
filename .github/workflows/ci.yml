name: CI

# Lint, test and build on every pull request and on pushes to main, so a PR can't
# merge green without the suite passing. Mirrors the toolchain in npm-publish.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test (with coverage threshold)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify the built entry exports the public API
        # 1.5.0 shipped a CJS bundle under `type: module`, so a bare import
        # returned no exports at all. Check the names, not a count.
        run: |
          node --input-type=module <<'EOF'
          const required = [
            'BibleBookData',
            'PAGE_SIZES',
            'alignedBibleSubjects',
            'assemblePrintDocument',
            'buildAppendicesToc',
            'buildCoverPage',
            'convertMarkdown',
            'convertNoteFromMD2HTML',
            'copyrightCss',
            'coverCss',
            'fetchResource',
            'generateCopyrightAndLicenseHtml',
            'generatePdf',
            'generatePdfFromAssembled',
            'generatePdfViaService',
            'generateTocFromHtml',
            'generateTocHtml',
            'getAllCatalogEntries',
            'getCatalogEntry',
            'getPrintCss',
            'getResourceData',
            'parseBooksOption',
            'renderAlignedBibleHtml',
            'renderAppendicesHtml',
            'renderHTML',
            'renderHtmlData',
            'renderObsHtml',
            'renderPdf',
            'renderTranslationAcademyHtml',
            'renderTranslationNotesHtml',
            'renderTranslationWordsHtml',
            'renderTsvQuestionsHtml',
            'requiredSubjectsMap',
            'resolveComposeOptions',
            'resolvePageSize',
            'runningHeaderModeFor',
            'subjectIdentifierMap',
            'supportsBodyColumns'
          ];
          const m = await import('./dist/index.esm.js');
          const missing = required.filter((k) => m[k] === undefined);
          if (missing.length) {
            console.error('missing exports: ' + missing.join(', '));
            process.exit(1);
          }
          console.log(required.length + ' required exports present');
          EOF
